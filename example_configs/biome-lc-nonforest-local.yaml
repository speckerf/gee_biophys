# North Wyke, Devon: temperate grassland/pasture.
# The selected ensemble predicts the full region; no vegetation-class mask.
spatial:
  type: square
  square_center: [-96.56, 39.1]
  square_length: 5000
  region_name: konza
temporal:
  start: '2024-01-01'
  end: '2024-12-31'
  cadence:
    type: seasons
    start: "05-15"
    end:   "06-15"
variables:
  model: s2biophys-biome-lc-specific
  biome_lc_name: temperate_nonforest
  variable: fapar
  bands:
  - mean
  - stdDev
  - count
options:
  max_cloud_cover: 50
  cs_plus_threshold: 0.65
export:
  destination: xee-local
  folder: exports/biome-lc-nonforest
  crs: LOCAL_UTM
  scale: 20
