# ============     GEE-Biophys  ================
# Minimal Grounded EO Example (local, xee-local export)
# ===============================================

spatial:
  type: bbox
  bbox: [7.1, 47.1, 7.2, 47.2]
  region_name: grounded-eo-demo

temporal:
  start: "2019-01-01"
  end:   "2026-01-01"
  cadence:
    type: seasons
    start: "05-15"
    end:   "08-15"

variables:
  model: groundedeo
  variable: lai
  bands: [mean, stdDev, count]

export:
  destination: xee-local
  folder: "exports/gee-biophys-grounded-eo"
  filename_prefix: "groundedeo"
  crs: "LOCAL_UTM"
  scale: 20

options:
  max_cloud_cover: 30
  csplus_band: cs
  cs_plus_threshold: 0.65
  clip_min_max: true
  prediction_mode: composite_then_predict

version: "v02"
