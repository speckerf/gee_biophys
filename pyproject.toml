[project]
name = "gee-biophys"
version = "2.1.0"
description = "Custom time-series export of LAIe/FAPAR/FCOVER with YAML params."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Felix Specker", email = "felix.specker@wsl.ch" }
]
license = { text = "MIT" } 
dependencies = [
    "earthengine-api>=1.6.15",
    "geojson>=3.2.0",
    "loguru>=0.7.3",
    "numpy",
    "onnxruntime>=1.29.0",
    "pandas>=2.3.3",
    "patch>=1.16",
    "pydantic>=2.12.4",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "scikit-learn==1.7.2",
    "typer>=0.12.0",
    "xarray>=2025.1.0",
    "xee>=0.1.2",
    "zarr>=2.18.0",
]

[project.scripts]
gee-biophys = "gee_biophys.cli:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# package your three code trees; skip non-code dirs
include = ["gee_biophys*", "models*", "train_pipeline*"]
exclude = ["notebooks*", "example_configs*", "test_configs*", "deprecated*", "geometries*", "auth*"]

[tool.setuptools.package-data]
"gee_biophys.models" = [
  "sl2p_params/*.json", 
  "s2biophys_params/**/*.pkl",
  "s2biophys_params/**/*.json",
  "s2biophys_params/**/*.csv",
  "s2biophys_biome_land_cover_specific_params/**/*.pkl",
  "s2biophys_biome_land_cover_specific_params/**/*.json",
  "groundedeo/*.onnx",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]
# (optional) ensure data is included
[tool.setuptools]
include-package-data = true

